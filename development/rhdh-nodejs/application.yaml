apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhdh-nodejs
  namespace: openshift-gitops
  labels:
    environment: development
    component: rhdh-nodejs
spec:
  project: default
  source:
    repoURL: https://github.com/rh-product-demos/rhdh-nodejs-manifests.git
    targetRevision: main
    path: development
  destination:
    server: https://kubernetes.default.svc
    namespace:rhdh-nodejs-development
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
