apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crewai-agent-one
  namespace: openshift-gitops
  labels:
    environment: development
    component: crewai-agent-one
spec:
  project: default
  source:
    repoURL: https://github.com/rh-product-demos/crewai-agent-one-manifests.git
    targetRevision: main
    path: development
  destination:
    server: https://kubernetes.default.svc
    namespace:crewai-agent-one-development
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
